name: Scraper tests (full suite)

# Runs EVERY test under scripts/scraper/__tests__ so a failing scraper test (for example one that
# imports a scraper whose main() fires on import) cannot hide behind the hand-picked lists in the
# other workflows.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scraper/**'
      - 'scripts/corrections/**'
      - 'src/utils/**'
      - 'package-lock.json'
      - '.github/workflows/scraper-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scraper/**'
      - 'scripts/corrections/**'
      - 'src/utils/**'
      - 'package-lock.json'
      - '.github/workflows/scraper-tests.yml'

jobs:
  scraper-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install pdftotext (used by PDF scraper tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Run the full scraper suite
        # cnbvScraper.test.ts is excluded by name only while the in-flight CNBV work lands: under
        # jsdom, scrapeCnbv.ts's top-level new URL(..., import.meta.url) throws. Remove this flag then.
        run: npx vitest run scripts/scraper --exclude scripts/scraper/__tests__/cnbvScraper.test.ts
