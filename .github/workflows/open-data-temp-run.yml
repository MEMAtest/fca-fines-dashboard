name: Open data temp run (temporary)
on:
  push:
    branches: [feat/open-data-routes]
    paths: ['.github/temp-run.json']
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGACTIONS_DATABASE_URL: ${{ secrets.REGACTIONS_DATABASE_URL }}
          REGACTIONS_EXPECTED_DB_HOST: ${{ vars.REGACTIONS_EXPECTED_DB_HOST }}
          REGACTIONS_EXPECTED_DB_NAME: ${{ vars.REGACTIONS_EXPECTED_DB_NAME }}
          TS_NODE_PROJECT: tsconfig.json
          SCRAPER_RUN_SUMMARY_FILE: /tmp/summary.json
        run: |
          SCRIPT=$(jq -r .script .github/temp-run.json)
          DRY=$(jq -r .dry_run .github/temp-run.json)
          if [ "$DRY" = "true" ]; then
            npm run "$SCRIPT" -- --dry-run | tee /tmp/run.log
          else
            npm run "$SCRIPT" | tee /tmp/run.log
          fi
          echo "---- summary"; cat /tmp/summary.json || true
      - name: Save log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: /tmp/run.log
