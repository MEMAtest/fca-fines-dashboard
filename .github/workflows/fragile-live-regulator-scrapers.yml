name: Fragile Live Regulator Scrapers

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC daily for lower-confidence live feeds

jobs:
  scrape:
    name: Scrape ${{ matrix.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: fragile-live-regulator-${{ matrix.code }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: DFSA
            script: scrape:dfsa
          - code: CBUAE
            script: scrape:cbuae
          - code: JFSC
            script: scrape:jfsc
          # CIRO runs on the Hetzner scraper host at 05:20 UTC daily, where
          # its local FlareSolverr service can clear the regulator's Cloudflare
          # challenge. GitHub-hosted runners are challenge-blocked and must not
          # create misleading CIRO failure records here.
          - code: FMAAT
            script: scrape:fmaat
          - code: FINMA
            script: scrape:finma
          - code: CMVM
            script: scrape:cmvm
          - code: MFSA
            script: scrape:mfsa
          - code: AUSTRAC
            script: scrape:austrac
          - code: DNB
            script: scrape:dnb
          # Playwright/Chromium feeds (WAF / Salesforce Lightning); need a
          # browser install step, unlike the puppeteer-based rows above.
          - code: IOMFSA
            script: scrape:iomfsa
            browser: playwright
          - code: FDIC
            script: scrape:fdic
            browser: playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ matrix.browser == 'playwright' }}
        run: npx playwright install chromium --with-deps

      - name: Verify environment configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set."
            exit 1
          fi

          echo "Environment validation passed for ${{ matrix.code }}."

      - name: Run ${{ matrix.code }} scraper
        id: run_scraper
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TS_NODE_PROJECT: tsconfig.json
          SCRAPER_RUN_SUMMARY_FILE: /tmp/${{ matrix.code }}-scrape-summary.json
        run: |
          echo "Starting ${{ matrix.code }} via npm run ${{ matrix.script }}"
          # Return control to the freshness gate before the outer 25-minute job
          # timeout can cancel the matrix entry and mark the whole run red.
          timeout --signal=TERM --kill-after=30s 20m npm run ${{ matrix.script }}

      - name: Print structured scraper summary
        if: always()
        run: |
          SUMMARY_FILE="/tmp/${{ matrix.code }}-scrape-summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            echo "Structured summary for ${{ matrix.code }}:"
            cat "$SUMMARY_FILE"
          else
            echo "No structured summary emitted for ${{ matrix.code }}."
          fi

      - name: Record scraper outcome for the freshness gate
        if: always()
        run: |
          SUMMARY_FILE="/tmp/${{ matrix.code }}-scrape-summary.json"

          if [ "${{ steps.run_scraper.outcome }}" = "failure" ]; then
            echo "::warning title=${{ matrix.code }} scraper fetch failed::The centralized freshness gate will decide whether this source requires action or remains watch-only."
          fi

          if [ -f "$SUMMARY_FILE" ]; then
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const summary = JSON.parse(fs.readFileSync(file, "utf8"));
              if (summary.status && summary.status !== "success") {
                const message = summary.errorMessage || `status=${summary.status}`;
                console.log(`::warning title=${summary.name || "${{ matrix.code }}"} scraper summary::${message}`);
              }
            ' "$SUMMARY_FILE"
          fi

          echo "Scraper execution is observational; the live-regulator freshness job is the authoritative workflow gate."

  freshness:
    name: Check fragile live-regulator freshness
    if: always()
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run freshness check for fragile live regulators
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run --silent check:live-freshness -- --cadence=fragile --json > /tmp/fragile-live-regulator-health.json
          cat /tmp/fragile-live-regulator-health.json

      - name: Upload fragile live-regulator health summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fragile-live-regulator-health
          path: /tmp/fragile-live-regulator-health.json
          if-no-files-found: ignore

      # Scraper-health email alerts are owned by scraper-assurance-agent.yml.
      # This batch workflow retains the health artifact but does not enqueue a second digest item.
