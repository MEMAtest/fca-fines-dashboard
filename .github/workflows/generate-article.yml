name: RegActions Editorial Engine

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * 1,3,5'  # Mon/Wed/Fri at 03:00 UTC
  workflow_dispatch:
    inputs:
      topic_override:
        description: 'Override topic selection (e.g. "AML enforcement trends")'
        required: false
        type: string

concurrency:
  group: regactions-editorial-engine
  cancel-in-progress: false

jobs:
  generate-review-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generate structured article draft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDITORIAL_PROVIDER: openrouter
          EDITORIAL_OPENROUTER_APPROVED: 'true'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          BLOG_REVIEW_EMAIL: ${{ secrets.BLOG_REVIEW_EMAIL }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic_override || '' }}
        run: npx tsx scripts/generate-ai-article.ts --result-file=/tmp/editorial-result.json

      - name: Resolve generated slug
        id: article
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const result = JSON.parse(readFileSync('/tmp/editorial-result.json', 'utf8'));
          if (
            typeof result?.slug !== 'string'
            || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(result.slug)
          ) {
            throw new Error('Editorial result must contain a valid kebab-case slug');
          }

          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            throw new Error('GITHUB_OUTPUT is not available');
          }

          appendFileSync(outputPath, `slug=${result.slug}\n`, 'utf8');
          NODE

      - name: Independent regulatory, copy, visual, and head review
        id: review
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDITORIAL_PROVIDER: openrouter
          EDITORIAL_OPENROUTER_APPROVED: 'true'
        run: npx tsx scripts/review-article.ts "${{ steps.article.outputs.slug }}"

      - name: Publisher Agent
        id: publish
        if: steps.review.outcome == 'success'
        run: npx tsx scripts/approve-article.ts "${{ steps.article.outputs.slug }}"

      - name: Commit editorial artifact
        id: publish_commit
        run: |
          git config user.name "RegActions Bot"
          git config user.email "bot@regactions.com"
          git add -A src/data/blogArticles.ts scripts/data public
          if [ "${{ steps.review.outcome }}" = "success" ]; then
            git diff --staged --quiet || git commit -m "feat(blog): publish ${{ steps.article.outputs.slug }}"
          else
            git diff --staged --quiet || git commit -m "chore(blog): retain blocked draft ${{ steps.article.outputs.slug }}"
          fi

          # A release can land on main while the editorial agents are running.
          # Rebase the immutable generated commit onto the latest main and retry
          # a small, bounded number of times; never overwrite another release.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase editorial artifact onto origin/main."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Editorial artifact pushed on attempt ${attempt}."
              exit 0
            fi
            echo "main advanced during push attempt ${attempt}; retrying."
          done
          echo "Editorial artifact could not be pushed after 3 attempts."
          exit 1

      - name: Retain generated editorial artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            scripts/data/drafts/${{ steps.article.outputs.slug }}.json
            scripts/data/published/${{ steps.article.outputs.slug }}.json
            public/blog/charts/${{ steps.article.outputs.slug }}-*

      - name: Trigger production deploy
        if: steps.publish.outcome == 'success' && steps.publish_commit.outcome == 'success'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi

      - name: Report blocked editorial review
        if: steps.review.outcome != 'success'
        run: |
          echo "Head Editorial Agent rejected the draft. The blocked audit artifact was retained."
          exit 1
