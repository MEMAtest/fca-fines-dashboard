name: Daily Live Regulator Scrapers

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *" # 05:45 UTC daily stable live-regulator batch

jobs:
  scrape:
    name: Scrape ${{ matrix.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: live-regulator-${{ matrix.code }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # FCA migrated to Hetzner cron 2026-05-21 (Cloudflare GHA IP block).
          # Cron entry: /etc/crontab on 89.167.95.173, runs /opt/regactions-scrapers
          # at 03:00 UTC. Re-enable here only if Hetzner cron is taken down.
          # - code: FCA
          #   script: scrape:fines
          - code: BaFin
            script: scrape:bafin
          - code: AMF
            script: scrape:amf
          - code: CNMV
            script: scrape:cnmv
          - code: CBI
            script: scrape:cbi
          # SFC migrated to Hetzner cron 2026-05-23 (Cloudflare GHA IP block).
          # - code: SFC
          #   script: scrape:sfc
          - code: AFM
            script: scrape:afm
          # ECB migrated to Hetzner cron 2026-05-23.
          # - code: ECB
          #   script: scrape:ecb
          # BDI migrated to Hetzner cron 2026-05-23.
          # - code: BDI
          #   script: scrape:bdi
          - code: ACPR
            script: scrape:acpr
          # CSSF migrated to Hetzner cron 2026-05-23.
          # - code: CSSF
          #   script: scrape:cssf
          - code: FSMA
            script: scrape:fsma
          # FISE migrated to Hetzner cron 2026-05-23.
          # - code: FISE
          #   script: scrape:fise
          - code: FTDK
            script: scrape:ftdk
          - code: FTNO
            script: scrape:ftno
          - code: CNBCZ
            script: scrape:cnbcz
          - code: CYSEC
            script: scrape:cysec
          - code: FINFSA
            script: scrape:finfsa
          - code: IVASS
            script: scrape:ivass
          # FSRA migrated to Hetzner cron 2026-05-23.
          # - code: FSRA
          #   script: scrape:fsra
          - code: GFSC
            script: scrape:gfsc
          - code: SEC
            script: scrape:sec
          # OCC migrated to Hetzner cron 2026-05-23.
          # - code: OCC
          #   script: scrape:occ
          - code: FINCEN
            script: scrape:fincen
          - code: FINRA
            script: scrape:finra
          - code: OSC
            script: scrape:osc
          - code: CVM
            script: scrape:cvm
          - code: CNBV
            script: scrape:cnbv
          - code: SESC
            script: scrape:sesc
          - code: SEBI
            script: scrape:sebi
          - code: ASIC
            script: scrape:asic
          - code: HKMA
            script: scrape:hkma
          # FMANZ migrated to the Hetzner scraper host, where the configured
          # FlareSolverr clears the official site's Cloudflare challenge.
          # Running it from GitHub Actions would create false zero/error runs.
          # - code: FMANZ
          #   script: scrape:fmanz
          - code: MAS
            script: scrape:mas
          - code: SC
            script: scrape:sc
          - code: BMA
            script: scrape:bma
          - code: CIMA
            script: scrape:cima
          # Wave F3 go-live: stable HTTP/JSON/CSV feeds join the daily batch.
          - code: SPK
            script: scrape:spk
          - code: FRB
            script: scrape:frb
          - code: GHSEC
            script: scrape:ghana-sec
            pdf: poppler
          - code: TWFSC
            script: scrape:twfsc
          - code: AMMC
            script: scrape:ammc
          - code: CNV
            script: scrape:cnv
          - code: FSS
            script: scrape:fss
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF text extraction
        if: ${{ matrix.pdf == 'poppler' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Verify environment configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || 'MEMA Consultants research@memaconsultants.com' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set."
            exit 1
          fi

          if [ "${{ matrix.code }}" = "SEC" ] && [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC_USER_AGENT fallback is not available."
            exit 1
          fi

          echo "Environment validation passed for ${{ matrix.code }}."

      - name: Run ${{ matrix.code }} scraper
        id: run_scraper
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCA_USER_AGENT: ${{ secrets.FCA_USER_AGENT }}
          FCA_YEARS: ${{ vars.FCA_YEARS }}
          FCA_START_YEAR: ${{ vars.FCA_START_YEAR }}
          FCA_END_YEAR: ${{ vars.FCA_END_YEAR }}
          FCA_SINCE_DATE: ${{ vars.FCA_SINCE_DATE }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || 'MEMA Consultants research@memaconsultants.com' }}
          SEC_SINCE_YEAR: ${{ vars.SEC_SINCE_YEAR }}
          SEBI_SINCE_YEAR: ${{ vars.SEBI_SINCE_YEAR }}
          SEBI_ENRICH_LIMIT: ${{ vars.SEBI_ENRICH_LIMIT }}
          CNBCZ_SINCE_YEAR: ${{ vars.CNBCZ_SINCE_YEAR }}
          CNBCZ_PDF_ENRICH_LIMIT: ${{ vars.CNBCZ_PDF_ENRICH_LIMIT }}
          CYSEC_PDF_ENRICH_LIMIT: ${{ vars.CYSEC_PDF_ENRICH_LIMIT }}
          TS_NODE_PROJECT: tsconfig.json
          SCRAPER_RUN_SUMMARY_FILE: /tmp/${{ matrix.code }}-scrape-summary.json
        run: |
          echo "Starting ${{ matrix.code }} via npm run ${{ matrix.script }}"
          # Return control to the freshness gate before the outer 30-minute job
          # timeout can cancel the matrix entry and mark the whole run red.
          timeout --signal=TERM --kill-after=30s 25m npm run ${{ matrix.script }}

      - name: Print structured scraper summary
        if: always()
        run: |
          SUMMARY_FILE="/tmp/${{ matrix.code }}-scrape-summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            echo "Structured summary for ${{ matrix.code }}:"
            cat "$SUMMARY_FILE"
          else
            echo "No structured summary emitted for ${{ matrix.code }}."
          fi

      - name: Record scraper outcome for the freshness gate
        if: always()
        run: |
          SUMMARY_FILE="/tmp/${{ matrix.code }}-scrape-summary.json"

          if [ "${{ steps.run_scraper.outcome }}" = "failure" ]; then
            echo "::warning title=${{ matrix.code }} scraper fetch failed::The centralized freshness gate will decide whether this source requires action or remains watch-only."
          fi

          if [ -f "$SUMMARY_FILE" ]; then
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const summary = JSON.parse(fs.readFileSync(file, "utf8"));
              if (summary.status && summary.status !== "success") {
                const message = summary.errorMessage || `status=${summary.status}`;
                console.log(`::warning title=${summary.name || "${{ matrix.code }}"} scraper summary::${message}`);
              }
            ' "$SUMMARY_FILE"
          fi

          echo "Scraper execution is observational; the live-regulator freshness job is the authoritative workflow gate."

  freshness:
    name: Check live-regulator freshness
    if: always()
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run freshness check for daily live regulators
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run --silent check:live-freshness -- --cadence=daily --json > /tmp/daily-live-regulator-health.json
          cat /tmp/daily-live-regulator-health.json

      - name: Upload daily live-regulator health summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-live-regulator-health
          path: /tmp/daily-live-regulator-health.json
          if-no-files-found: ignore

      - name: Audit data freshness across live regulators
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_FRESHNESS_ALERT_FILE: /tmp/data-freshness-alert.json
        run: |
          npm run --silent check:data-freshness || true
          if [ -f /tmp/data-freshness-alert.json ]; then
            cat /tmp/data-freshness-alert.json
          fi

      - name: Upload data freshness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-freshness-audit
          path: /tmp/data-freshness-alert.json
          if-no-files-found: ignore

      # Scraper-health email alerts are owned by scraper-assurance-agent.yml.
      # The broad audit remains an artifact-only evidence path.
