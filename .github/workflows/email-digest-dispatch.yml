name: Email Digest Dispatch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview recipients and queued item counts without sending"
        required: true
        default: true
        type: boolean
  schedule:
    # Covers 07:00 London in GMT and BST; the script enforces the local-hour window.
    - cron: "*/15 6-7 * * *"

concurrency:
  group: email-digest-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure dispatcher database permissions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/jobs/ensureEmailDigestPermissions.ts

      - name: Dispatch one consolidated email per recipient
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION || 'eu-west-2' }}
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL || 'alerts@memaconsultants.com' }}
          INTERNAL_DIGEST_EMAIL: ${{ vars.INTERNAL_DIGEST_EMAIL }}
          OPS_ALERT_EMAIL: ${{ vars.OPS_ALERT_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: npx tsx scripts/jobs/dispatchEmailDigests.ts ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
