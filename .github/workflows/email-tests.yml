name: Email tests

# Runs only the email kit and template tests. The full vitest suite has
# unrelated failures on main, so it is not run here.
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/services/emailKit/**'
      - 'server/services/emailTemplates/**'
      - 'server/services/email*.ts'
      - 'server/services/personaDigest*.ts'
      - 'server/services/personaScoring.ts'
      - 'server/services/firmPersonas.ts'
      - 'scripts/scraper/scrapeBafin*.ts'
      - 'api/cron/process-monitors.ts'
      - 'vercel.json'
      - '.github/workflows/email-tests.yml'

jobs:
  email-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run email tests
        run: npx vitest run server/services/emailKit server/services/emailTemplates server/services/personaDigestEmail.test.ts server/services/personaDigestContent.test.ts server/services/personaDigestService.test.ts scripts/scraper/__tests__/scrapeBafinAmounts.test.ts server/services/emailDigest.test.ts server/services/emailDigestDispatch.test.ts api/cron/process-monitors.test.ts
