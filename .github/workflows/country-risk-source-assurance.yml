name: Country risk source assurance

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "23 6 * * 0"
    - cron: "31 7 1 * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "daily, weekly, monthly, or all"
        required: false
        default: "all"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sanctions-daily:
    if: github.event_name == 'schedule' || inputs.lane == 'daily' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify country-risk contextual evidence contract
        run: npm run country-risk:verify-context
      - run: npm run country-risk:check-sanctions
      - if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run country-risk:persist-sanctions-source-run
      - run: npm run country-risk:ingest-eu-sanctions
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanctions-source-review
          path: |
            /tmp/country-risk-sanctions-review.json
            src/data/euSanctionsRegimeData.ts

  sanctions-weekly-fragile-evidence:
    needs: fatf-weekly-fragile
    if: (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 0') || inputs.lane == 'weekly' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FATF may have merged a refreshed evidence snapshot in the preceding job.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run country-risk:check-sanctions
      - if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run country-risk:persist-sanctions-source-run
      - run: npm run country-risk:ingest-eu-sanctions
      - name: Prepare legal-measure evidence with browser fallback for protected UN pages
        run: xvfb-run -a npm run country-risk:prepare-sanctions-evidence
      - run: npm run country-risk:sanctions-census
      - run: npm run country-risk:sanctions-review-pack
      - name: Complete deterministic sanctions decisions
        id: classify
        run: npm run country-risk:classify-sanctions
      - name: Sync, validate, apply and promote the evidence snapshot
        id: promote
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run country-risk:migrate
          npm run country-risk:sync-sanctions
          npm run country-risk:apply-sanctions-review -- --dry-run
          npm run country-risk:apply-sanctions-review
          npm run country-risk:promote-sanctions -- --dry-run
          npm run country-risk:promote-sanctions
      - name: Verify the promoted model
        id: verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx scripts/country-risk/generate-score-run.ts --require-ready --persist
          npm run country-risk:validate
          # This lane changes only country-risk source evidence. Keep its release
          # gate focused on the model, evidence and API contracts it promotes;
          # unrelated editorial fixtures must not block an otherwise verified
          # official-source snapshot.
          npm test -- --run \
            src/data/countryRisk*.test.ts \
            src/data/sanctions*.test.ts \
            server/countryRisk*.test.ts \
            scripts/country-risk/lib/*.test.ts
          npm run build
      - name: Open the content-addressed snapshot update
        id: snapshot_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/country-risk-snapshot
          delete-branch: true
          commit-message: "data(country-risk): promote official-source snapshot"
          title: "data(country-risk): promote official-source snapshot"
          body: |
            Automated country-risk source assurance passed.

            - official catalogue hashes and fingerprints current
            - deterministic classifications complete
            - 214 x 4 sanctions coverage complete
            - score release gate, tests and build passed

            External validation remains explicitly labelled in snapshot metadata.
          labels: country-risk,automated-data
      - name: Merge the verified snapshot update
        if: steps.snapshot_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash "${{ steps.snapshot_pr.outputs.pull-request-number }}"
      # The weekly promotion is the only lane that publishes a sanctions
      # snapshot, and until now its failure was silent: the daily lane keeps
      # passing because it only checks catalogue health, and the source-health
      # alert below fires on that check rather than on this job. When this broke
      # on 23 August 2026 nothing raised it — the snapshot simply aged out, and
      # the only symptom eight days later was a unit test tripping the 8-day
      # freshness threshold. That is far too indirect for sanctions data.
      - name: Open or update the sanctions promotion alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Country Risk] Weekly sanctions promotion failed';
            const body = [
              'The weekly sanctions promotion lane failed, so the published snapshot is not being refreshed.',
              '',
              'Until it is fixed the snapshot ages, and `countryRiskSources` marks `sanctions-regimes`',
              'stale once it passes the 8-day threshold. **Do not suppress that** — it is the control working.',
              '',
              'Most failures here are the deterministic classifier refusing to publish a classification it',
              'cannot evidence, which is by design. Check the job log for the record it named, compare the',
              "prepared evidence against the stored row, and decide whether the regulator's page changed",
              'or the extractor needs updating.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'country-risk',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['country-risk'],
              });
            }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanctions-legal-evidence-review
          path: |
            /tmp/country-risk-sanctions-review.json
            /tmp/country-risk-sanctions-census.json
            /tmp/country-risk-sanctions-census.md
            /tmp/country-risk-sanctions-legal-evidence.json
            /tmp/country-risk-sanctions-taxonomy-review.json
            /tmp/country-risk-sanctions-taxonomy-review.md
            /tmp/country-risk-sanctions-deterministic-review.json
            /tmp/country-risk-v2-score-run.json
            /tmp/country-risk-v2-validation.json

  fatf-weekly-fragile:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 0') || inputs.lane == 'weekly' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify FATF official black and grey lists
        id: fatf_lists
        continue-on-error: true
        run: xvfb-run -a npm run country-risk:verify-fatf -- --write
      - name: Retain current FATF list evidence as a watch
        if: steps.fatf_lists.outcome == 'failure'
        run: node --import tsx/esm scripts/country-risk/check-fatf-list-watch.ts
      - name: Ingest the latest FATF consolidated ratings
        id: fatf_assessments
        continue-on-error: true
        run: xvfb-run -a npm run country-risk:ingest-fatf
      - name: Retain current FATF assessment evidence as a watch
        if: steps.fatf_assessments.outcome == 'failure'
        run: node --import tsx/esm scripts/country-risk/check-fatf-assessment-watch.ts
      - name: Validate the FATF evidence update
        run: |
          npm run country-risk:validate
          npm test -- --run \
            feature-validation/unit/fatf-verify.test.ts \
            src/data/fatfChangeLog.test.ts \
            src/data/fatfAssessmentLinks.test.ts \
            scripts/scraper/__tests__/fatfAssessmentParser.test.ts
          npm run build
      - name: Open the FATF ratings update
        id: fatf_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/country-risk-fatf
          delete-branch: true
          commit-message: "data(country-risk): refresh FATF evidence"
          title: "data(country-risk): refresh FATF evidence"
          body: |
            Automated FATF ratings ingestion, focused tests, validation and build passed.

            Live black/grey-list verification outcome: `${{ steps.fatf_lists.outcome }}`.
            Consolidated-ratings workbook ingestion outcome: `${{ steps.fatf_assessments.outcome }}`.
            When the protected page was unavailable, the job retained the last verified list only after confirming that its dated, hashed evidence remained inside the operational freshness threshold; the outage is recorded as a watch artifact.
            When the protected workbooks were unavailable, the job retained the last schema-validated ratings only after confirming at least 100 records and a dated hash inside the 45-day freshness threshold.

            The dependent sanctions job performs the combined score-readiness persistence and full-suite gate.
          labels: country-risk,automated-data
      - name: Merge the verified FATF update
        if: steps.fatf_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash "${{ steps.fatf_pr.outputs.pull-request-number }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatf-list-review
          path: |
            /tmp/country-risk-fatf-list-review.json
            /tmp/country-risk-fatf-list-watch.json
            /tmp/country-risk-fatf-assessment-watch.json

  monthly-release-detection:
    if: (github.event_name == 'schedule' && github.event.schedule == '31 7 1 * *') || inputs.lane == 'monthly' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest the latest complete WGI release
        run: npx tsx scripts/ingest-wgi.ts
      - name: Ingest the latest official CPI release for context
        run: npm run country-risk:ingest-cpi
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/country-risk/generate-score-run.ts --require-ready --persist
      - run: npm run country-risk:validate
      - run: npm test -- --run
      - run: npm run build
      - name: Open the monthly source and score update
        id: monthly_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/country-risk-monthly
          delete-branch: true
          commit-message: "data(country-risk): refresh monthly sources"
          title: "data(country-risk): refresh monthly sources"
          body: "Automated WGI/CPI release detection, score persistence, validation, tests and build passed."
          labels: country-risk,automated-data
      - name: Merge the verified monthly update
        if: steps.monthly_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash "${{ steps.monthly_pr.outputs.pull-request-number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: country-risk-monthly-evidence
          path: |
            /tmp/country-risk-v2-score-run.json
            /tmp/country-risk-v2-validation.json

  source-health:
    name: Country risk source health and alerting
    if: always()
    needs:
      - sanctions-daily
      - sanctions-weekly-fragile-evidence
      - fatf-weekly-fragile
      - monthly-release-detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Upstream ingestion jobs can merge refreshed evidence into main.
          # Assess the resulting repository state, not the workflow's stale
          # trigger SHA, otherwise a successful promotion reports a false
          # source-health failure until the next run.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assess production source health
        id: health
        continue-on-error: true
        timeout-minutes: 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run country-risk:source-health
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-risk-source-health
          path: |
            /tmp/country-risk-source-health.json
            /tmp/country-risk-source-health.md
      - name: Open or update the source-health alert
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Country Risk] Source health alert';
            const reportPath = '/tmp/country-risk-source-health.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : '# Country risk source health — CRITICAL\n\nThe health report could not be generated.';
            const body = `${report}\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'country-risk',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['country-risk'],
              });
            }
      - name: Close a resolved source-health alert
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Country Risk] Source health alert';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'country-risk',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Source health returned to normal in workflow run ${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
      - name: Fail the workflow after alerting
        if: steps.health.outcome == 'failure'
        run: exit 1
