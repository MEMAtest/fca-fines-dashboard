name: Open data route probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [feat/open-data-routes]
    paths: ['.github/workflows/open-data-route-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: FSC Mauritius repeat
        run: |
          for i in 1 2 3 4 5 6; do
            curl -s -m 40 -A "RegActions-research" -L https://www.fscmauritius.org/en/enforcement/enforcement-actions -o /tmp/fsc$i.html -w "PROBE attempt $i %{http_code} %{size_download}\n"
            grep -o '<title>[^<]*' /tmp/fsc$i.html | head -1 | sed 's/^/PROBE title /'
            sleep 20
          done
